name: Build RPK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create app icon
        run: |
          mkdir -p src/common
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > src/common/logo.png
      - name: Install dependencies
        run: npm install
      - name: Build RPK
        run: npm run build
      - name: Show build output
        if: always()
        run: find . -maxdepth 5 -type f | sort | tail -200
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: hoshanot-rpk
          path: |
            dist/**/*.rpk
            build/**/*.rpk
            **/*.rpk
          if-no-files-found: error
